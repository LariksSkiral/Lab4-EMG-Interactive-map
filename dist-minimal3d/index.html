<!DOCTYPE html>
<!--
  Main viewer page for Minimal3D.
  This page focuses on navigation and model viewing.
  Upload/admin actions are moved to admin.html.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal3D Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" crossorigin href="/assets/ui-DbGlvlcE.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-logo">⬡ Minimal3D</span>
        <span class="tb-scene-name">Viewer Mode</span>
      </div>
      <div class="tb-right">
        <span class="tb-badge">Guest</span>
        <a class="tb-btn active" href="index.html">Viewer</a>
        <a class="tb-btn" href="admin.html">Admin</a>
      </div>
    </header>

    <main class="main-stage">
      <canvas id="three-canvas"></canvas>

      <section class="floating-card" aria-label="Viewer instructions">
        <h2>3D Viewer</h2>
        <p>
          Use mouse drag to rotate, scroll to zoom, and right-click drag to pan.
          Open Admin to upload models and load files from Supabase storage.
        </p>
        <div class="floating-row">
          <span class="chip">Orbit Controls</span>
          <span class="chip">GLB Ready</span>
          <span class="chip">Supabase Linked</span>
        </div>
      </section>
    </main>
  </div>

  <!-- Vite replaces these placeholders with .env values when served. -->
  <script>
    window.APP_CONFIG = {
      SUPABASE_URL: 'https://hziltkgyworuslnpadmb.supabase.co',
      SUPABASE_ANON_KEY: 'sb_publishable_s1XrmOzmECiC-Q4YqRp6wg_tipgegsE',
      SUPABASE_BUCKET: 'models',
      SUPABASE_FOLDER: '',
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/core/state.js"></script>
  <script src="js/core/renderer.js"></script>
  <script src="js/objects/factory.js"></script>
  <script src="supabase.js"></script>
  <script src="js/core/main.js"></script>
</body>
</html>
