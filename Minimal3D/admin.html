<!DOCTYPE html>
<!--
  Admin page for Minimal3D.
  This page contains management tools such as Supabase model upload and loading.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal3D Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="tb-left">
        <span class="tb-logo">⬡ Minimal3D</span>
        <span class="tb-scene-name">Admin Mode</span>
      </div>
      <div class="tb-right">
        <span class="tb-badge">Admin</span>
        <a class="tb-btn" href="index.html">Viewer</a>
        <a class="tb-btn active" href="admin.html">Admin</a>
        <button id="btn-auth-logout" class="tb-btn" type="button">Logout</button>
      </div>
    </header>

    <section id="login-panel" class="auth-shell">
      <div class="auth-card">
        <h2>Admin Login</h2>
        <p>
          Sign in with your Supabase account to unlock admin actions like model upload and management.
        </p>

        <label class="auth-label" for="auth-email">Email</label>
        <input id="auth-email" class="auth-input" type="email" placeholder="name@example.com" autocomplete="email">

        <label class="auth-label" for="auth-password">Password</label>
        <input id="auth-password" class="auth-input" type="password" placeholder="Your password" autocomplete="current-password">

        <div class="auth-row">
          <button id="btn-auth-login" class="auth-btn" type="button">Login</button>
          <button id="btn-auth-register" class="auth-btn secondary" type="button">Register</button>
        </div>

        <div id="auth-error" class="auth-error" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Admin workspace: fullscreen 3D canvas + overlay taskbar + slide-in drawer -->
    <div id="admin-panel" class="admin-workspace is-hidden">

      <!-- 3D scene fills the entire workspace -->
      <canvas id="three-canvas"></canvas>

      <!-- Slide-in uploader drawer (hidden by default, opens when + is clicked) -->
      <aside id="uploader-drawer" class="uploader-drawer" aria-label="Model uploader">
        <div class="drawer-header">
          <div class="drawer-title-row">
            <span class="drawer-icon">⬡</span>
            <span class="drawer-title">Upload Model</span>
          </div>
          <button id="drawer-close" class="drawer-close" type="button" title="Close panel">✕</button>
        </div>

        <!-- Step 1: Drop zone / file picker -->
        <div class="drawer-section">
          <p class="drawer-label">Add a 3D file to your Supabase bucket</p>

          <!-- Drag-and-drop zone. Click or drag a file onto it. -->
          <label id="drop-zone" class="drop-zone" for="sb-file-input" tabindex="0" role="button"
                 aria-label="Drag and drop a .glb or .gltf file, or click to browse">
            <span class="drop-icon">↑</span>
            <span class="drop-primary">Drop .glb or .gltf here</span>
            <span class="drop-secondary">or click to browse your files</span>
            <!-- Hidden real file input, triggered by the label above -->
            <input id="sb-file-input" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"
                   style="position:absolute;inset:0;opacity:0;cursor:pointer;">
          </label>

          <!-- File preview: shown after a file is selected, hidden by default -->
          <div id="file-preview" class="file-preview is-hidden">
            <span class="file-preview-icon">◈</span>
            <div class="file-preview-info">
              <span id="file-preview-name" class="file-preview-name">filename.glb</span>
              <span id="file-preview-size" class="file-preview-size">— KB</span>
            </div>
            <button id="file-preview-clear" class="file-preview-clear" type="button" title="Remove file">✕</button>
          </div>

          <button id="sb-upload-btn" class="drawer-btn primary" type="button" disabled>
            Upload to Supabase
          </button>
        </div>

        <!-- Divider between upload and model library -->
        <div class="drawer-divider"></div>

        <!-- Step 2: Uploaded models library -->
        <div class="drawer-section">
          <div class="drawer-library-header">
            <span class="drawer-label">Uploaded models</span>
            <button id="sb-refresh-btn" class="drawer-icon-btn" type="button" title="Refresh list">↻</button>
          </div>

          <!-- List of files fetched from Supabase, populated dynamically -->
          <div id="sb-file-list" class="sb-file-list">
            <!-- Items are injected here by supabase.js listFilesAndPopulateDropdown -->
            <div class="sb-file-empty">No models uploaded yet</div>
          </div>

          <!-- Hidden select kept for backwards-compatibility with supabase.js logic -->
          <select id="sb-file-select" style="display:none"></select>

          <button id="sb-load-btn" class="drawer-btn secondary" type="button" disabled>
            Load selected model
          </button>
        </div>

        <!-- Status / error message at the bottom of the drawer -->
        <div id="sb-status" class="drawer-status" role="status" aria-live="polite"></div>
      </aside>

      <!-- Figma-style bottom taskbar, floating over the 3D viewport -->
      <nav class="taskbar" aria-label="Editor tools">
        <!-- Primary: add / upload action -->
        <button id="btn-open-uploader" class="task-btn primary" type="button" title="Upload model">
          <span class="task-icon task-icon-plus">＋</span>
          <span class="task-label">Add</span>
        </button>

        <!-- Divider between primary and secondary actions -->
        <div class="taskbar-sep"></div>

        <!-- Secondary: transform tools (placeholder, will be wired up later) -->
        <div class="taskbar-group">
          <button class="task-btn" type="button" title="Move (coming soon)" disabled>
            <span class="task-icon">⤢</span>
            <span class="task-label">Move</span>
          </button>
          <button class="task-btn" type="button" title="Scale (coming soon)" disabled>
            <span class="task-icon">⤡</span>
            <span class="task-label">Scale</span>
          </button>
          <button class="task-btn" type="button" title="Rotate (coming soon)" disabled>
            <span class="task-icon">↻</span>
            <span class="task-label">Rotate</span>
          </button>
        </div>
      </nav>

    </div>
  </div>

  <!-- Vite replaces these placeholders with .env values when served. -->
  <script>
    window.APP_CONFIG = {
      SUPABASE_URL: '%VITE_SUPABASE_URL%',
      SUPABASE_ANON_KEY: '%VITE_SUPABASE_ANON_KEY%',
      SUPABASE_BUCKET: '%VITE_SUPABASE_BUCKET%',
      SUPABASE_FOLDER: '%VITE_SUPABASE_FOLDER%',
    };
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/core/state.js"></script>
  <script src="js/core/renderer.js"></script>
  <script src="js/objects/factory.js"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="js/core/main.js"></script>
</body>
</html>
